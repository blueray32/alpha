# {{name}} - Validation Flow
# Generated by QA-Lens agent
# Tests: {{description}}

name: {{flowName}}
steps:
  # Navigate to the page
  - open: "${baseUrl}{{pagePath}}"

  # Verify page loaded
  - assert: "{{mainSelector}}"

{{#testSteps}}
  # {{stepDescription}}
  - {{action}}: {{#actionData}}"{{value}}"{{/actionData}}{{#hasSelector}}
      selector: "{{selector}}"{{/hasSelector}}{{#hasText}}
      text: "{{text}}"{{/hasText}}
{{/testSteps}}

  # Take screenshot for verification
  - screenshot: "checks/run-${run_id}/{{screenshotName}}.png"
