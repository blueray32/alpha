<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: {{maxWidth}}px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2em;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    #result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      display: block;
    }

    #result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      display: block;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{heading}}</h1>
    <p>{{description}}</p>

    <form id="main-form">
      {{#formFields}}
      <div class="form-group">
        <label for="{{id}}">{{label}}</label>
        <{{fieldType}}
          id="{{id}}"
          name="{{name}}"
          type="{{inputType}}"
          {{#required}}required{{/required}}
          placeholder="{{placeholder}}"
        {{#isTextarea}}rows="4"{{/isTextarea}}></{{fieldType}}>
      </div>
      {{/formFields}}

      <button type="submit" id="submit-btn">{{buttonText}}</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('main-form');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Get form data
      const formData = new FormData(form);
      const data = Object.fromEntries(formData);

      // Show loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';
      result.style.display = 'none';

      try {
        // Send request to API
        const response = await fetch('{{apiEndpoint}}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        });

        const responseData = await response.json();

        if (response.ok) {
          // Success
          result.className = 'success';
          result.textContent = responseData.message || '{{successMessage}}';
          form.reset();
        } else {
          // Error
          result.className = 'error';
          result.textContent = responseData.error || 'Something went wrong';
        }
      } catch (error) {
        result.className = 'error';
        result.textContent = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '{{buttonText}}';
      }
    });
  </script>
</body>
</html>
