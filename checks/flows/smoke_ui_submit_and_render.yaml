name: smoke/ui_submit_and_render
steps:
  - open: "${baseUrl}/"
  - assert: "#url-input"
  - type:
      selector: "#url-input"
      text: "https://example.com/test-url-for-validation"
  - assert: "#shorten-btn"
  - click: "#shorten-btn"
  - wait_for: "#result"
  - assert: "#short-url"
  - screenshot: "checks/run-${run_id}/result.png"
